<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilibili Clipper</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="hero">
        <div class="hero-top">
          <span class="brand">B站字幕</span>
          <div class="top-actions">
            <button id="aiBtn" type="button" class="ghost ghost-ai">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M11.5 4.2l2.05 5.5 5.45 2.05-5.45 2.05-2.05 5.5-2.05-5.5L4 11.75 9.45 9.7l2.05-5.5z"></path>
                <path d="M18.4 4.6l.72 1.92 1.92.72-1.92.72-.72 1.92-.72-1.92-1.92-.72 1.92-.72.72-1.92z"></path>
              </svg>
              <span>AI</span>
            </button>
            <button id="settingsBtn" type="button" class="ghost">设置</button>
          </div>
        </div>
        <h1 id="videoTitle" class="video-title">尚未识别视频</h1>
        <p id="videoMeta" class="video-meta"></p>
      </header>

      <div id="progress" class="progress" hidden>
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      </div>

      <div class="field">
        <label class="field-label" for="subtitleSelect">语言</label>
        <select id="subtitleSelect"></select>
      </div>

      <section class="preview-card">
        <div class="preview-head">
          <span id="previewCount" class="preview-count"></span>
        </div>
        <textarea id="preview" readonly wrap="soft"></textarea>
      </section>

      <div class="actions">
        <button id="copyBtn" type="button">复制</button>
        <button id="downloadBtn" type="button">下载</button>
        <button id="readingViewBtn" type="button">阅读</button>
      </div>

      <button id="whisperBtn" type="button" class="whisper" hidden>生成字幕</button>
      <button id="sendBtn" type="button" class="send">保存到 Obsidian</button>
      <p id="message" class="message"></p>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
